name: level-1-tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Public-tree scan
        run: python scripts/scan_public_repository.py
      - name: Unit and scientific-invariant tests
        run: python -m pytest -q
      - name: Level-2 Source Data redraw and numeric reconciliation
        run: |
          python scripts/reproduce_core_results.py
          python scripts/plot_figures.py
      # This workflow does not download public datasets and does not claim
      # LEVEL 3 scientific reproduction from raw accessions.
